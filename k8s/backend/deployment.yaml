apiVersion: apps/v1
kind: Deployment
metadata:
  name: zuri-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zuri-backend
  template:
    metadata:
      labels:
        app: zuri-backend
    spec:
      containers:
        - name: zuri-backend
          image: erobhose/zuriapp-backend:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: zuri-backend-config